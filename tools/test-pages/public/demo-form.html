<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blip Synthetic Survey</title>
    <script src="/report.js"></script>
    <style>
      :root { font: 16px/1.5 system-ui, sans-serif; color: #202b25; background: #edf2ed; }
      body { margin: 0; padding: 32px 18px; }
      main { width: min(640px, 100%); margin: auto; padding: 28px; border: 1px solid #d2ddd3; border-radius: 16px; background: white; }
      h1 { margin-top: 0; }
      .intro { color: #586a5d; }
      .question { margin: 22px 0; }
      .question h2 { margin: 0 0 4px; font-size: 1rem; }
      .question p { margin: 0 0 9px; color: #586a5d; }
      input { width: 100%; height: 46px; padding: 0 12px; border: 1px solid #aebdb1; border-radius: 8px; font: inherit; }
      button { min-height: 46px; margin-top: 10px; padding: 0 18px; border: 0; border-radius: 8px; color: white; background: #1f694a; font: inherit; font-weight: 700; }
      #form-status { min-height: 24px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Community Survey</h1>
      <p class="intro">A local-only practice form. Use fictional values; nothing leaves this computer.</p>
      <form id="demo-survey" action="/submit-sink.html" method="get">
        <section class="question">
          <h2>Full name</h2>
          <p id="name-hint">Enter the fictional name to show on your survey response.</p>
          <div><input id="contact-name" name="contact-name" autocomplete="name" placeholder="Name" aria-describedby="name-hint" required></div>
        </section>
        <section class="question">
          <h2>Email address</h2>
          <p id="email-hint">Use the reserved example.invalid domain for this practice form.</p>
          <div><input id="contact-email" name="contact-email" type="email" autocomplete="email" placeholder="Email" aria-describedby="email-hint" required></div>
        </section>
        <button id="submit-survey" type="submit">Submit survey</button>
        <button id="reset-survey" type="reset">Reset form</button>
        <p id="form-status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script>
      const form = document.querySelector("#demo-survey");
      form?.addEventListener("submit", (event) => {
        event.preventDefault();
        window.blipReport("demo-survey-submit", { prevented: true });
        document.querySelector("#form-status").textContent = "Local submit observed. No data was sent.";
      });
      form?.addEventListener("reset", () => {
        document.querySelector("#form-status").textContent = "Form reset.";
      });
      window.blipReport("page-ready", { fixture: "synthetic-survey" });
    </script>
  </body>
</html>
